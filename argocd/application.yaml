apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    # TODO: replace with the URL of the GitHub/GitLab.com repo you push this folder to.
    repoURL: https://github.com/mycp14/sampleglasslewis.git
    targetRevision: HEAD
    path: my-app
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  syncPolicy:
    automated:
      prune: true     # delete resources removed from Git
      selfHeal: true  # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
